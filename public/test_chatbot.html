<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Chatbot API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        #log { border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: auto; background: #f5f5f5; }
        button { padding: 10px 20px; margin: 10px 5px 10px 0; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Test API Chatbot</h1>
    <button onclick="testAPI()">Tester l'API</button>
    <button onclick="clearLog()">Effacer</button>
    <div id="log"></div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        async function testAPI() {
            log('🚀 Démarrage du test...', 'info');
            
            const payload = {
                messages: [
                    { role: 'user', content: 'Bonjour, je veux faire une réclamation' }
                ],
                formData: {}
            };
            
            log(`📤 Envoi vers: /api/chatbot/reclamation`, 'info');
            log(`📦 Payload: ${JSON.stringify(payload)}`, 'info');
            
            const startTime = Date.now();
            
            try {
                const response = await fetch('/api/chatbot/reclamation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                const duration = Date.now() - startTime;
                log(`⏱️ Réponse reçue en ${duration}ms`, 'info');
                log(`📊 Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                log(`📋 Content-Type: ${response.headers.get('Content-Type')}`, 'info');
                
                if (!response.ok) {
                    const text = await response.text();
                    log(`❌ Erreur: ${text}`, 'error');
                    return;
                }
                
                const data = await response.json();
                log(`✅ Données reçues:`, 'success');
                log(`   Message: ${data.message ? data.message.substring(0, 100) + '...' : 'N/A'}`, 'success');
                log(`   Suggestions: ${data.suggestions ? JSON.stringify(data.suggestions) : 'N/A'}`, 'success');
                log(`   Sentiment: ${data.sentiment || 'N/A'}`, 'success');
                log(`   Not configured: ${data.not_configured || false}`, 'success');
                
            } catch (error) {
                const duration = Date.now() - startTime;
                log(`❌ Erreur après ${duration}ms: ${error.message}`, 'error');
                log(`❌ Type d'erreur: ${error.name}`, 'error');
                console.error('Full error:', error);
            }
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            log('✅ Page chargée. Cliquez sur "Tester l\'API" pour lancer le test.', 'info');
        });
    </script>
</body>
</html>
